name: iOS 16.2 frontend compatibility
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Typecheck actual app sources for iOS 16.2
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          while IFS= read -r file; do sources+=("$file"); done < <(find AetherPS4-iOS/Sources -name '*.swift' | sort)
          xcrun swiftc -typecheck -swift-version 5 -target arm64-apple-ios16.2 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -import-objc-header AetherPS4-iOS/AetherPS4-iOS-Bridging-Header.h \
            -I src/platform/ios -I src/core/pkg_extract \
            -I src/core/sysmodules_import -I src/core/user_profile_bridge \
            "${sources[@]}"
      - name: Stress test backported reader/writer mutex
        run: |
          xcrun clang++ -std=c++20 -O2 -pthread \
            -I runtime/sources/fexcore-darwin/FEXCore/include \
            -I runtime/sources/fexcore-darwin/External/fmt/include \
            -I runtime/sources/fexcore-darwin/FEXHeaderUtils \
            -I runtime/sources/fexcore-darwin/CodeEmitter \
            tests/ios16/write_priority_mutex.cpp -o /tmp/aether-mutex-test
          /tmp/aether-mutex-test
      - name: Test cancellation-aware wait fallback
        run: |
          xcrun clang++ -std=c++20 -O2 -pthread -I src tests/ios16/stop_wait.cpp -o /tmp/aether-stop-wait-test
          python3 -c 'import subprocess; subprocess.run(["/tmp/aether-stop-wait-test"], check=True, timeout=15)'
