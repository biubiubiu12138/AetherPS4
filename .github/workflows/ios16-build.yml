name: Build experimental iOS 16.2 IPA
on:
  push:
    paths:
      - CMakeLists.txt
      - generate_project.rb
      - src/**
      - AetherPS4-iOS/**
      - externals/CMakeLists.txt
      - .gitmodules
      - .github/workflows/ios16-build.yml
      - runtime/scripts/build-ios16.sh
      - runtime/scripts/audit-ios16-app.py
      - runtime/scripts/patch-ios-dependencies.py
      - runtime/sources/fexcore-darwin/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ios16-xcode164-${{ github.run_id }}
          restore-keys: ios16-xcode164-
      - uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-19.1.0
          path: runtime/sources/llvm-charconv
          persist-credentials: false
          sparse-checkout: |
            libcxx/src
            libcxx/LICENSE.TXT
      - name: Fetch native dependencies
        run: |
          paths=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | grep -vE 'box64|winlator|mesa-kosmickrisp|vulkan-loader')
          git submodule update --init --depth 1 --jobs 8 -- $paths
          git submodule foreach --recursive 'git submodule update --init --depth 1 --jobs 8'
      - name: Install build utilities
        run: |
          brew install ninja cmake ccache
          python3 -m venv /tmp/aether-build-python
          /tmp/aether-build-python/bin/pip install packaging
          echo /tmp/aether-build-python/bin >> "$GITHUB_PATH"
          gem install xcodeproj --user-install --no-document
      - name: Build FEX, native core and app
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 2G
        run: bash runtime/scripts/build-ios16.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ios16-xcode164-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-iOS16.2-experimental
          path: runtime/build/ios16-output/*.ipa
          if-no-files-found: error
